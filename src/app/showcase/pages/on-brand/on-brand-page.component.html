<ds-page-header label='Inputs — variant="on-brand"' selector="" [code]="snippet" />

<section class="component-section">
  <h3 class="variant-label">fundo transparente · borda/textos/ícones em primary-contrast</h3>

  <div class="on-brand-panel">
    <creamy-kit-dropdown
      variant="on-brand"
      title="País"
      placeholder="Selecione"
      helper="Sobre fundo da marca"
      [options]="countryOptions"
    />

    <creamy-kit-search variant="on-brand" placeholder="Buscar…">
      <svg iconRight viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </creamy-kit-search>

    <creamy-kit-password
      variant="on-brand"
      title="Senha"
      placeholder="Mínimo 8 caracteres"
      helper="Use letras e números"
    />

    <creamy-kit-textbox
      variant="on-brand"
      title="Comentário"
      placeholder="Escreva aqui…"
      helper="Seja breve"
      [maxLength]="120"
    />
  </div>

  <div class="documentation">
    <div class="doc-card">
      <h3>variant="on-brand"</h3>
      <p>
        Disponível em <strong>dropdown</strong>, <strong>textbox</strong>,
        <strong>search</strong> e <strong>password</strong>. Fundo transparente;
        borda, textos e ícones sempre em Action/primary/contrast — inclusive no
        estado desabilitado e de erro. Pensado para superfícies da marca.
      </p>
    </div>
  </div>
</section>

<ds-code-example [code]="snippet" />
