<ds-page-header label="Calendar" selector="creamy-kit-calendar" [code]="snippet" />

<section class="component-section">
  <div class="calendar-row">
    <creamy-kit-calendar
      footerLabel="Data selecionada"
      footerValue="auto"
      [(ngModel)]="calendarDate"
    />
    <creamy-kit-calendar
      footerLabel="Disponibilidade"
      footerValue="Agenda aberta para março"
      [(ngModel)]="calendarDate"
    />
    <creamy-kit-calendar [(ngModel)]="calendarDate" />
  </div>

  <div class="documentation">
    <div class="doc-card">
      <h3>Calendar</h3>
      <ul>
        <li>Navegação de mês, seleção de dia (círculo primary), emite <code>(dateChange)</code></li>
        <li><code>footerLabel</code> — título (negrito) do rodapé</li>
        <li><code>footerValue</code> — <code>''</code> (oculto) · <code>'auto'</code> (data selecionada) · texto livre</li>
      </ul>
      <p>Implementa <code>ControlValueAccessor</code> (valor = <code>Date</code>).</p>
    </div>
  </div>
</section>
